<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D3166" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved (or device) theme before first paint — no light flash in dark mode.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (t === 'dark') { document.documentElement.classList.add('dark'); document.documentElement.style.colorScheme = 'dark'; }
        } catch (e) {}
      })();
    </script>
    <meta name="robots" content="index, follow" />
    <meta name="description" content="Find your next home with Surprise Real Estate — browse houses and apartments for rent by location, price, and features, with real map locations for every listing." />
    <link rel="apple-touch-icon" href="/logo.webp" />

    <!-- Open Graph / Twitter Card — static defaults for social-media link
         previews (most unfurl bots don't execute JS); per-page title and
         description are additionally set at runtime, see
         src/hooks/useDocumentTitle.js. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Surprise Real Estate" />
    <meta property="og:title" content="Surprise Real Estate" />
    <meta property="og:description" content="Find your next home with Surprise Real Estate — browse houses and apartments for rent by location, price, and features, with real map locations for every listing." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1613977257363-707ba9348227?auto=format&fit=crop&w=1200&h=630&q=80" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Surprise Real Estate" />
    <meta name="twitter:description" content="Find your next home with Surprise Real Estate — browse houses and apartments for rent by location, price, and features, with real map locations for every listing." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1613977257363-707ba9348227?auto=format&fit=crop&w=1200&h=630&q=80" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Surprise Real Estate</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
